{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">

<!--
==============================================================================
  登录页模板（T4 的界面部分）
  对应视图：app01/views/account.py → login_view()
  对应验证码：app01/utils/captcha.py → generate_captcha()

  为什么这个页面不继承 layout.html？
  因为 layout.html 里有顶部导航（部门/员工/薪资…），未登录的人根本进不去那些页面，
  看到一排点了就跳登录的菜单没有意义。登录页做成独立页面更干净。
==============================================================================
-->

<head>
    <meta charset="UTF-8">
    <title>登录 - 企业员工管理系统</title>
    <!-- Bootstrap 用本地文件：教室断网或校园网拦截 CDN 时，样式不会整个丢掉 -->
    <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
    <style>
        body { background: #f5f7fa; padding-top: 100px; }
        .login-box { max-width: 400px; margin: 0 auto; background: #fff;
                     padding: 30px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        /* 验证码按原始比例显示，别压扁；图片本身 150×48 */
        .captcha-img { cursor: pointer; height: 44px; width: auto; display: block; }
    </style>
</head>
<body>
<div class="login-box">
    <h3 class="text-center" style="margin-bottom:20px;">企业员工管理系统</h3>

    <!--
      错误提示区：内容来自视图 render 时传的 error 字段
      三种情况都会落到这里：验证码错误 / 用户名或密码错误
      注意"用户不存在"和"密码错误"给的是同一句提示，避免被人枚举出哪些账号真实存在
    -->
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

    <!-- 表单 POST 到 /login/，和 app01/urls.py 里的 path("login/", ...) 对应 -->
    <form method="post" action="/login/">
        <!-- CSRF：Django 的 CsrfViewMiddleware 会校验这个隐藏字段，缺了直接 403 -->
        {% csrf_token %}

        <div class="form-group">
            <label>用户名</label>
            <!-- 后端从 request.POST.get("username") 取值 -->
            <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
        </div>

        <div class="form-group">
            <label>密码</label>
            <!-- type=password 只是遮盖显示；后端拿到明文后再用 check_password 与库里的哈希比对 -->
            <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
        </div>

        <div class="form-group">
            <label>验证码</label>
            <div class="input-group">
                <input type="text" name="captcha" class="form-control" placeholder="验证码" required>
                <span class="input-group-addon" style="padding:0;border:none;">
                    <!--
                      src 指向 /captcha/：后端每次返回一张新图，并把 4 位答案写进 session。
                      图片里只有像素没有文本，所以前端拿不到答案，这个校验没法绕过。

                      onclick 里拼 "?随机数" 是为了绕过浏览器缓存：
                      不加时间戳时，浏览器会一直用缓存里那张旧图，用户点了"刷新"看到的还是同一张。
                    -->
                    <img class="captcha-img" src="/captcha/"
                         onclick="this.src='/captcha/?'+Math.random()" title="点击刷新">
                </span>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>

    <!--
      小提示（答辩时可以直接讲这一点）：
      输入框上的 required 只是浏览器层面的便利校验，按 F12 删掉就能绕过，
      所以真正的校验必须在视图里再做一遍——login_view() 里三个字段都判断了空值。
    -->
</div>
</body>
</html>
