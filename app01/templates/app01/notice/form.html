{% extends "app01/layout.html" %}
{% block content %}
<!--
  发布公告页（T8 的界面部分）
  对应视图：app01/views/notice.py 的 notice_add()

  字段只渲染 title / content / is_top 三个，控件样式由 NoticeForm 继承的
  BootStrapModelForm 自动加上 form-control。
  发布人和发布时间不在表单里：user 由视图从 request.user 取（防止有人伪造成别人发的），
  create_time 由模型 auto_now_add 自动写。
-->
<div class="page-title">发布公告</div>
<div class="panel panel-default">
    <div class="panel-body">
        <form method="post" action="/notice/add/" class="form-horizontal">
            {% csrf_token %}
            <div class="form-group">
                <label class="col-sm-2 control-label">标题</label>
                <div class="col-sm-6">{{ form.title }}</div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">内容</label>
                <div class="col-sm-6">{{ form.content }}</div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">是否置顶</label>
                <div class="col-sm-6">{{ form.is_top }}</div>
            </div>
            <div class="form-group">
                <div class="col-sm-offset-2 col-sm-6">
                    <button type="submit" class="btn btn-primary">发布</button>
                    <a href="/notice/list/" class="btn btn-default">返回</a>
                </div>
            </div>
        </form>
    </div>
</div>
<style>
    #id_title, #id_content { width:100%; }
</style>
{% endblock %}
